[build]
target = "index.html"
features = ["gh-pages"]
release = true
dist = "dist"
public_url = "/epub-reader-rs/"
filehash = true
inject_scripts = true
minify = "on_release"

[watch]
ignore = ["./src-tauri", "./target", "./dist", "./public/tailwind.css"]

# pre_build (not build): the build hook runs in parallel with the pipeline, so
# on a fresh checkout trunk's rel="css" link resolves before css:build writes
# public/tailwind.css (gitignored). pre_build guarantees the file exists first.
# `node` (not `npm`): Trunk spawns hooks without a shell, so on Windows `npm`
# (npm.cmd) can't be spawned. `node` resolves on every OS. Same effect as
# `npm run css:build`/`tts:build`; keeps this config identical to Trunk.toml.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["node_modules/@tailwindcss/cli/dist/index.mjs", "-i", "style/input.css", "-o", "public/tailwind.css", "--minify"]

# Build the Piper TTS bundle + fetch its wasm assets before the copy-dir runs.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["scripts/build-tts.mjs"]

# Prefix the absolute /tts/ asset paths with the gh-pages base path.
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["scripts/ghpages-basepath.sh"]
