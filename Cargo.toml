[package]
name = "epub-reader-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
console_log = "1"
log = "0.4"
console_error_panic_hook = "0.1"
base64 = "0.23"
gloo-storage = "0.4"
icondata = { version = "0.7", default-features = false, features = ["lucide"] }
js-sys = "0.3"
leptos_icons = "0.7"
quick-xml = "0.41"
rexie = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
thiserror = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "js", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlIFrameElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "Range",
    "Selection",
    "Window",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
gloo-timers = { version = "0.4", features = ["futures"] }

[features]
gh-pages = []


[dev-dependencies]
wasm-bindgen-test = "0.3"


# opt-level "s": ottimizza per dimensione del wasm (l'app è pura UI; il TTS gira
# in JS/onnxruntime-web, quindi non serve la velocità di calcolo di opt-level 3).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
