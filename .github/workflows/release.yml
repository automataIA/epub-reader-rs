name: Release (desktop)

# Builds the Tauri desktop app with native GPU TTS for Windows, macOS and Linux
# and attaches the installers to a GitHub Release. Triggered by a version tag
# (e.g. v0.1.0). The WebAssembly / GitHub Pages build is handled by deploy.yml.
#
# GPU execution provider is selected per-OS at compile time (Cargo.toml):
#   Windows → DirectML   macOS → CoreML   Linux → CUDA (CPU fallback at runtime).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple Silicon only. ort rc.12 ships no prebuilt onnxruntime
          # for x86_64-apple-darwin, so the Intel target is dropped.
          - platform: macos-latest
            target: aarch64-apple-darwin
          # ubuntu-24.04 (glibc 2.39): the ort prebuilt is built against
          # glibc >= 2.38 (C23 __isoc23_strtoll symbols); 22.04 (glibc 2.35)
          # fails to link with "undefined symbol: __isoc23_strtoll".
          - platform: ubuntu-24.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.target && format(',{0}', matrix.target) || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache TTS wasm assets
        uses: actions/cache@v4
        with:
          path: |
            public/tts/ort
            public/tts/piper
          key: tts-assets-${{ hashFiles('scripts/build-tts.mjs', 'package-lock.json') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          # See deploy.yml: set repo variable TRUNK_VERSION to bump in one place.
          version: ${{ vars.TRUNK_VERSION || 'v0.21.14' }}

      - name: Install Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Build & release desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EPUB Reader RS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # `--features gpu-tts` builds the native GPU TTS engine (per-OS EP).
          args: ${{ matrix.target && format('--target {0} ', matrix.target) || '' }}--features gpu-tts
