name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect whether the desktop crate is affected, so the 3-OS matrix below only
  # runs when it must. src-tauri is an isolated crate (no shared code with src/),
  # so frontend-only changes cannot break its clippy.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tauri:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  # WebAssembly frontend (the crate at the repo root): clippy on the wasm target
  # plus the native unit tests (epub parser lives in src/epub.rs).
  web:
    name: wasm · clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Test (native unit tests)
        run: cargo test

  # Tauri desktop crate: clippy with the native GPU-TTS feature. The GPU
  # execution provider is chosen per-OS (DirectML/CoreML/CUDA), so lint on all
  # three to catch target-specific breakage. `ort` downloads onnxruntime at build.
  desktop:
    name: tauri · clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Clippy (gpu-tts)
        working-directory: src-tauri
        run: cargo clippy --features gpu-tts -- -D warnings
